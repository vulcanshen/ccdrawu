id: 15
from: v1.2.20
to: v1.3.5
tasks:
  - id: 1
    spec: 1
    request: 側邊欄一列一項，顯示用量上限、context、模型、花費、git、session 統計等；有些預設開、有些預設關，打開的列一定顯示，還沒有值時顯示 -
    tdp: [tdp P5]
    remark:
      - 預設開：Pet、Model、Effort、Mode、Context、Session、Weekly、Cost、Uptime、Cache、Compact、Tasks、Git、Path、Claude、ccdrawu
      - 預設關：Style、ID、Window、Spend、Rate、Tokens、Speed、Skills、Sync、Files、Commit、Repo、Directory、Status
      - Context、Session、Weekly 畫 bar，50%、70%、90% 從綠變黃、橘、紅；Effort 從 low 綠到 max 紅
      - 側邊欄是 Claude Code 的外掛畫的，不是 terminu-go 的畫面；列與顏色是 app 的功能邏輯（tdp P5）
  - id: 2
    spec: 8
    request: 側邊欄在 session 開始時自動打開，放在對話旁邊或輸入框上方；兩個位置可以各自關掉
    tdp: [tdp P5, tdp radio, tdp panel.12, tdp M5, tdp M5-32]
    remark:
      - 放哪裡由 Claude Code 決定：fullscreen 渲染、終端機夠寬（約 110～144 欄）時在對話旁邊，其他時候在輸入框上方
      - Claude 桌面版把面板最小化成小卡片（widget，Claude Code 2.1.328 起）時，畫成輸入框上方的樣子；Drawer 的設定不關掉它（使用者 2026-11-19：Claude Code 更新帶來的警告要處理）
      - 輸入框上方時項目排成好幾欄文字，不畫 bar
      - ccdrawu 的 sidebar 頁與 inline 頁最上面各有 Drawer（on／off）；inline 設 off 時，終端機窄到放不下就收起來，不跑到輸入框上方
      - 要使用者打的指令用反引號包起來，顏色跟周圍一樣：放不下時的 toast「Type `/ccdrawu` to show the drawer above the prompt」（tdp M5；tdp v1.2.18；tdp #25）
  - id: 3
    spec: 1
    request: /ccdrawu 開關輸入它的這個 session 的側邊欄，Claude 回覆到一半也能用
    tdp: [tdp P5]
    remark:
      - 打開後不管 Drawer 的設定都顯示；關掉後終端機拉寬縮窄都不再出現；之後改了 Drawer 就改回照設定走
  - id: 4
    spec: 8
    request: 設一個比較短的別名指令，例如 /ccd，跟 /ccdrawu 一樣能用
    tdp: [tdp P5, tdp text, tdp panel.12, tdp M5, tdp M5-32]
    remark:
      - 在 preferences 的 Alias 設；存在 config.yaml 的 alias，也可以直接改檔；改掉或拿掉的名字在 session 重開前都還能用
      - Alias 輸入框的提示「One more name for `/ccdrawu`, such as ccd; empty for none」，指令用反引號（tdp M5；tdp v1.2.18；tdp #25）
  - id: 5
    spec: 1
    request: 側邊欄最上面有一隻像素寵物陪著：Claude 工作時走動、做完時坐下說一句、出錯時跳、閒著時趴下再睡著
    tdp: [tdp P5]
    remark:
      - 在輸入框上方時佔最左邊一欄，不顯示台詞和球
      - 台詞是固定的幾句，不花 token；花色每個 session 隨機
  - id: 6
    spec: 8
    request: /ccdrawu pat 摸摸寵物，/ccdrawu ball 丟一顆球給牠玩
    tdp: [tdp P5, tdp M5, tdp M5-32]
    remark:
      - 寵物項目的說明裡「`/ccdrawu pat` pats it」，指令用反引號（tdp M5；tdp v1.2.18；tdp #25）
  - id: 7
    spec: 2
    request: 有 subagent 在跑時，每個 subagent 有一隻同類的小隻在寵物後面走，最多三隻，從左邊或右邊走進場；小隻偶爾會跳，路上遇到 git 的紙箱，每一層（包含地面）都可能跳到，隨機算，在層間穿插移動，箱子中間每一個地方都可能跳上去走動
    tdp: [tdp P5]
    remark:
      - 只畫在側邊欄；每隻的花色都不同，也不跟大隻的一樣；subagent 開始時從走道外面走進來，結束時走到走道外面才消失
      - 紙箱變高或變低的地方一定重挑、在紙箱中間每一步也有機會重挑，從地面到那裡最高的一層隨機挑一層；層數照紙箱實際疊幾層算，紙箱多一層不用改（取代 2026-11-06 的「遇到紙箱一定跳到最上層」）
      - 最高只站到上面還放得下最高的小隻（兔子）的那一層：走道 7 列時是第二層，第三層上面沒有空間，小隻在它前面走
      - 站在下層或地面時畫在上層紙箱的前面
  - id: 8
    spec: 2
    request: 在 git repo 裡，寵物走道的右端堆紙箱：每個還沒 commit 的檔案一個紙箱，每個還沒 push 的 commit 一個封箱；commit 之後變成封箱，push 之後消失；箱子可以疊到第三層
    tdp: [tdp P5]
    remark:
      - 只畫在側邊欄，最多 9 個（每層 3 個、疊三層，用掉走道上面原本空著的空間）；沒有上游分支的 branch 不畫封箱
      - 封與沒封用樣子分，不用顏色分：封箱蓋著蓋子，沒封的紙箱上面開著
  - id: 9
    spec: 1
    request: 換寵物的動物：貓、狗、兔子、鴨子、企鵝
    tdp: [tdp radio, tdp panel.12]
    remark:
      - 在 preferences 的 Pet 設，一秒內開著的 session 跟著換；不想要寵物就在項目清單取消勾選 Pet
  - id: 10
    spec: 8
    request: ccdrawu 當 Claude Code 的狀態列（輸入框下方那一列），照使用者挑的項目、順序、寫法排成一列
    tdp: [tdp P5, tdp E1, tdp E3, tdp E3-36, tdp E3-39, tdp M5, tdp M5-32]
    remark:
      - Claude Code 執行 ccdrawu statusline；太長時結尾截掉加 …；on when narrow 時，側邊欄在對話旁邊或終端機夠寬就整列收起來
      - 狀態列是印給 Claude Code 顯示的輸出，算 TUI 以外（tdp E3、P5）：config.yaml 讀不了、或有用不了的值時，不動檔（沒有 .bak、不重寫），這一次用預設值照樣畫，最後加一個紅色的標記寫出哪個檔有什麼問題；備份、重寫、跳 toast 留給下次打開的 TUI（tdp E3-36、E3-39；tdp #22，tdp v1.2.17）
      - 標記後面接「; run `ccdrawu doctor`」，提示怎麼修（task 28；使用者 2026-11-19）；放不下時先把 key 的清單改成幾個值，再拿掉提示；讀不了的一定留原因，提示先讓位；提示用一般文字的顏色，指令用反引號包起來、跟提示同色（使用者 2026-11-20；tdp M5；tdp v1.2.18；tdp #25）
  - id: 11
    spec: 8
    request: 在 ccdrawu 的 statusline 頁設定狀態列：開關（on、off、on when narrow）、項目、順序、寫法、顏色、分隔、重跑間隔
    tdp: [tdp radio, tdp text, tdp number, tdp confirm, tdp F6, tdp panel.12, tdp P5, tdp M5, tdp M5-32, tdp E3]
    remark:
      - 打開時在 ~/.claude/settings.json 設成 ccdrawu statusline；原本就有狀態列的，先問過才換掉，並記下原本的，關掉或移除時換回去
      - Format：label、short、value；Color：highlighted、dimmed；Separator 沒設是 |；Refresh 沒設是 10 秒
      - 打開時那段說明「Turning the statusline off, or `ccdrawu uninstall claude`, puts it back.」，指令用反引號（tdp M5；tdp v1.2.18；tdp #25）
  - id: 12
    spec: 4
    request: 在 ccdrawu 挑側邊欄（或狀態列）顯示哪些項目
    tdp: [tdp checkbox, tdp finder, tdp E3, tdp note.7, tdp panel.12]
    remark:
      - Items 上按 Enter 開所有項目的清單：Space 勾、最上面 Select all 全選、Enter 套用、Esc 不改、/ 打字篩選；新勾的排在它前一項後面
      - config.yaml 裡外掛寫的項目清單沒有的 id 是「app 不認得的名字」，啟動時照 E3 拿掉；還沒有項目清單時無從判斷，不動
  - id: 13
    spec: 12
    request: 在 ccdrawu 排側邊欄（或狀態列）的項目順序
    tdp: [tdp reorder, tdp panel.12, tdp K13]
    remark:
      - Order 上按 Enter：D 拿起一項、j k 移動、Enter 放下、再 Enter 存起來、Esc 放回原樣
      - D 是 reorder 的拿起（Drag），不是刪除；ccdrawu 沒有 Diff 模式，K13 准同一個 panel 把 D 給不是刪除的動作（tdp v1.2.20）
  - id: 14
    spec: 10
    request: ccdrawu 的畫面：左邊分組列出 Drawer（sidebar、inline）、Statusline（statusline）、Settings（preferences），右邊是選到的那一頁的值
    tdp: [tdp screen.1, tdp panel.5, tdp panel.11, tdp panel.12, tdp panel.13, tdp M3, tdp E3, tdp note.7]
    remark:
      - 開著的 session 在一秒內跟著換
      - 手改 config.yaml 留下的不合的值，啟動時就換成預設（tdp E3），畫面上不再有標 Red 的值；只有 Plugin 列在查不到外掛時標 Red
      - 寬度有剩時放最後（tdp panel.5 的預設，tdp v1.2.19 起 app 替每個清單挑一種）：[1] 只有一欄、沒有表頭，其他三種（一欄填滿、平均、加大欄距）都是在欄與欄之間分寬度，一欄的清單用不上
  - id: 15
    spec: 12
    request: 讓側邊欄的底色跟終端機一樣：選一個 Claude Code 內建主題當底，再選側邊欄的底色
    tdp: [tdp P5, tdp M5, tdp select, tdp color-picker, tdp M2, tdp M3, tdp panel.12, tdp E2, tdp K13, tdp E3]
    remark:
      - ccdrawu 寫 ~/.claude/themes/ccdrawu.json 並在 Claude Code 選用；Claude theme 設回 off 或移除時換回原本的主題
      - Drawer background 上按 x 改回主題原本的底色（tdp P5 的領域熱鍵）
      - x 拿掉使用者設的底色，就是 cursor 上那一個值，K13 的刪除一律在 x（tdp v1.2.20）；ccdrawu 沒有任何刪除放在 D 或 d
  - id: 16
    spec: 1
    request: 終端機的字型畫不出 bar 時，把 Bar 換成 line
    tdp: [tdp radio, tdp E4, tdp panel.12]
    remark:
      - 每個選項旁邊畫著它的 bar，終端機畫得出哪一種一看就知道
  - id: 17
    spec: 12
    request: 在 ccdrawu 裡安裝外掛；外掛還沒寫出項目清單時，頁面說還沒有東西可以列、提示怎麼裝
    tdp: [tdp confirm, tdp F6, tdp screen.8, tdp note.7, tdp K3, tdp panel.12, tdp M5, tdp M5-32, tdp note-104, tdp note-105, tdp E3, tdp toast, tdp F5, tdp panel.15, tdp K13]
    remark:
      - preferences 的 Plugin 上按 Enter 安裝外掛
      - Plugin 的 Enter 是裝與移除的切換，跟 off、on 一樣：問過才做，移除了一樣按 Enter 裝回來，不是把一項永久拿掉，所以不算 K13 的刪除，不放在 x；也不在 D、d（tdp v1.2.20）
      - 安裝與移除的 confirm 裡 `ccdrawu install claude`、`/reload-plugins`、`ccdrawu uninstall claude` 用反引號（tdp M5；tdp v1.2.18；tdp #25）
      - ccdrawu 開著時每 2 秒看一次外掛寫的 catalog.json（自己重讀的內容）：讀到項目變了，App Log 記一筆 INFO 寫出外掛加了、拿掉了哪些項目；外掛寫了同樣的一份（修改時間變了、項目沒變）不記（tdp note.7、note-104）。讀不了：照 E3 是快取，不問、丟掉等外掛重寫；啟動時那一次記 WARN；之後重讀時第一次失敗跳 Error toast、記 ERR，同一個失敗再來不跳不記，換了一個失敗再跳；又讀得到時記一筆 INFO（<路徑> can be read again），不跳 toast（tdp note.7、note-105；tdp v1.2.18）
  - id: 18
    spec: 8
    request: ccdrawu install claude 把同一版的外掛裝進 Claude Code，ccdrawu uninstall claude 拿掉它並換回原本的主題與狀態列
    tdp: [tdp P5, tdp E1, tdp E2, tdp E3, tdp E6, harness project.3, tdp M5, tdp M5-32, tdp E1-4, tdp E1-6, tdp E1-8, tdp E3-40]
    remark:
      - 只用這兩個指令（或 ccdrawu update）裝外掛，不用 /plugin：外掛要跟指令同一版
      - uninstall 讀不了 config.yaml 或 originals.yaml 時停下來，什麼都不動，寫出是哪個檔與原因（tdp E3）
      - uninstall 遇到 config.yaml 有用不了的值：複製成 .bak、換成預設寫回，那句寫到 stderr，照樣往下做（tdp E3，值不合規則）
      - 照 tdp E1 的命令列格式（tdp v1.2.18；tdp #24）：錯誤一行一件、開頭 ccdrawu: 、大寫開頭；uninstall 遇到用不了的值，stderr 寫 TUI 的同一句話：toast 那一列、每個值的 WARN、不讀的 key 的 INFO（tdp E3）；安裝後那兩句的 `/reload-plugins`、`ccdrawu` 用反引號（tdp M5；tdp v1.2.18；tdp #25）
  - id: 19
    spec: 15
    request: ccdrawu update 照安裝的方式更新 ccdrawu，再把 Claude Code 裡的外掛更新成同一版
    tdp: [tdp P5, tdp E1, tdp M5, tdp M5-32, tdp E1-4, tdp E1-8, tdp E1-9, tdp E1-10, harness project.4, tdp E6]
    remark:
      - Homebrew 裝的交給 Homebrew；安裝腳本裝的下載 release 的執行檔、用 checksum 驗過再換掉自己；Scoop 裝的說要跑什麼；資料夾不能寫入時說明原因後停下來
      - 訊息裡要使用者打的指令用反引號：`git pull && make install`、`ccdrawu install claude`、`ccdrawu update`（tdp M5；tdp v1.2.18；tdp #25）；錯誤一行一件、開頭 ccdrawu: 、大寫開頭（tdp E1；tdp v1.2.18；tdp #24）；Scoop 那段的指令各自一行縮排，不在句子裡，不加
      - 照 tdp E1 的 update（tdp v1.3.0 起每個 app 都有，照 ccdrawu 的做法寫）：已經是最新版說 is the latest release、比最新正式版還新（beta）說 is newer than the latest release, <最新>，都 exit 0
      - 最新版從 github.com/vulcanshen/ccdrawu/releases/latest 轉到哪個 tag 看，不用 GitHub API：API 不帶登入時同一個網路每小時共用 60 次，用完回 403（使用者 2026-11-20 遇到）；下載本來就不走 API
      - 用 terminu-go 的 SelfUpdate（使用者 2026-11-24 選的）：家族同一份 update，lib 修的 ccdrawu 都跟著有；ccdrawu 自己的只剩更新完的事（tdp E1：app 可以自行決定）：Claude Code 有外掛就用最新的 ccdrawu 跑 install claude；從原始碼編的、Scoop 裝的，手動更新後要跑的 ccdrawu install claude 寫在 Then
      - {note: SelfUpdate 原本也用 API 查、會遇到同一個 403；terminu-go v1.3.7 照 ccdrawu 提的做法改看轉址，修好了（2026-11-24 terminu 通知）, issue: 本機用 SendMessage 傳給 terminu-go session（2026-11-24，使用者選不發 GitHub）}
  - id: 20
    spec: 8
    request: ccdrawu version 印版本，ccdrawu help 印用法
    tdp: [tdp E1, harness project.4, tdp M5, tdp M5-32, tdp E1-4, tdp E1-5, tdp E1-6, tdp E1-7, tdp E1-8]
    remark:
      - 命令列照 tdp E1（tdp v1.2.18；tdp #24）：錯誤與警告寫 stderr、一件一行、開頭 ccdrawu: 、大寫開頭（路徑、檔名、程式名開頭的照原樣）；結果與進度寫 stdout；用錯（不認得的指令、install 或 uninstall 少了 claude）寫「ccdrawu: <哪裡錯>」、空一行、用法，exit 2，例「Unknown command "x"」「Say where: `ccdrawu install claude`」（tdp M5）；exit 0 做完、1 沒做完、2 用錯
  - id: 21
    spec: 14
    request: 設定、快取、原本的主題與狀態列，各放在系統規定的位置；可以用環境變數改；舊版的檔第一次執行時搬過來；讀不了時先問；讀得進來、只有用不了的值時，備份後換成預設
    tdp: [tdp E2, tdp E3, tdp confirm, tdp toast, tdp note.6, tdp note.7, tdp P5, tdp E3-36, tdp E3-38, tdp E3-39, tdp M5, tdp M5-32, tdp E3-37, tdp toast.2]
    remark:
      - ~/.config/ccdrawu/config.yaml（CCDRAWU__CONFIG、XDG_CONFIG_HOME）；系統快取資料夾裡的 ccdrawu（CCDRAWU__CACHE）；~/.ccdrawu/originals.yaml（CCDRAWU__DATA）
      - config.yaml 讀不了：寫出原因，Enter 改名成 config.yaml.bak、用預設值開始，Esc 離開
      - 用不了的值（不認得的名字、不是 #rrggbb 的顏色、超過 60 或負的秒數、外掛不收的 alias、有控制字元的分隔、型別不對的值）：啟動時複製成 config.yaml.bak、換成預設寫回，跳 Warning toast，App Log 每個值一筆 WARN；備份做不出來時不寫回、跳 Error toast（tdp E3，值不合規則）
      - 同一次啟動有搬家又有不合的值：各一個 toast，照發生的順序往上疊，App Log 一件一筆（tdp E3，同一次啟動有好幾件；tdp v1.3.0 起不再合成一個，toast.2）
      - 外掛畫的側邊欄（不在 TUI 裡的畫面，TUI 以外，tdp E3、P5）：config.yaml 讀不了、或有用不了的值時，不動檔，照預設畫，在面板最上面用一列寫出哪個檔有什麼問題；備份、重寫、跳 toast 留給下次打開的 TUI（tdp E3-36、E3-39；tdp #23，tdp v1.2.17）
      - 側邊欄那一列後面接「; run `ccdrawu doctor`」，提示怎麼修（task 28；使用者 2026-11-19），提示用一般文字的顏色，指令用反引號包起來、跟提示同色（使用者 2026-11-20；tdp M5；tdp v1.2.18；tdp #25）
      - ccdrawu 不讀的 key（以前讀過的，或從來沒讀過的、例如打錯的）留在檔案裡，重寫時也留著，不跳 toast，每次啟動在 App Log 記一筆 INFO：以前讀過的寫 No longer used，其他寫 Not read（tdp E3-38；tdp #21，tdp v1.2.17）
  - id: 22
    spec: 1
    request: ccdrawu 在至少 40 欄寬、12 列高、支援 truecolor 的終端機跑，要 Nerd Font；圖示佔的格數可以用環境變數設
    tdp: [tdp L1, tdp E4, tdp E5, tdp E8]
    remark:
      - CCDRAWU__ICON_WIDTH、CCDRAWU__POWERLINE_WIDTH 只給 ccdrawu；TERMINU__ICON_WIDTH、TERMINU__POWERLINE_WIDTH 給整個家族
      - 最低尺寸 40×12：tdp L1 讓 app 自己決定要不要調低（不能高於 60×32）；ccdrawu 開在 Claude Code 旁邊的窄 pane 裡
  - id: 23
    spec: 1
    request: ccdrawu 有 splash，畫家族的 icon
    tdp: [tdp S1, tdp S2, tdp S5, tdp E6]
  - id: 24
    spec: 1
