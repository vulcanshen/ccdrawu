  - id: 27
    spec: 13
    request: 背景的 shell 和 monitor 補回走道上：shell 預設是會伸出觸角爬的海螺（原本是蝸牛；樣子可以在設定換，task 29）、monitor 是貓頭鷹，像球一樣會跟寵物互動；主 agent 靜止時寵物偶爾去抓一下；幾個就幾隻，可以重疊，每一隻的配色隨機生成，同一種的顏色不要重複；貓頭鷹每休息 10 秒就起飛，振翅飛 10 秒再降落，也會停在箱子上；貓頭鷹的眼睛會左右看
    tdp: [tdp P5]
    remark:
      - 只畫在側邊欄；在輸入框上方時只有寵物
      - 蝸牛從走道外面爬進來，結束後爬出去，不趕即時顯示有無；貓頭鷹飛進來、飛走
      - 被抓時蝸牛縮進殼裡，貓頭鷹張開翅膀；寵物只去抓停在地上的
      - 貓頭鷹停在箱子上最高到上面還放得下牠的那一層（跟小隻一樣是第二層），第三層牠停在前面
      - 貓頭鷹飛的時候振翅：翅膀上、平、下、平一輪（方案 2）
      - 貓頭鷹的眼睛左右看（使用者 2026-11-24，看了預覽與 GIF 同意）：瞳孔換到眼睛的另一邊；休息時每隔幾秒隨機換邊看，照舊眨眼；飛的時候看著飛的方向
      - 貓頭鷹降落後休息 10 秒，起飛在走道上方來回飛 10 秒，時間到就在當下的位置降落，再休息 10 秒（使用者 2026-11-20；取代原本約 10 秒一次、隨機起飛換個地方停）；每隻從自己降落的時候算，不會一起飛
      - 場上有它們時寵物不睡，最多趴著；Claude 工作時寵物照常閒逛，不特別去抓
      - 顏色不重複（使用者 2026-11-20）：殼與羽毛的色相挑在同種現有色相之間最大的空檔中間，仍帶隨機；只跟同種比，因為蝸牛和貓頭鷹的形狀本來就分得出來，貓頭鷹彩度低，要把色相空間留給同種；小隻是從固定幾種花色挑沒用過的，這裡色相是連續的，所以改成挑空檔
      - 海螺（使用者 2026-11-20，看了三輪預覽挑的）：圓頂殼、螺塔小小凸在頂上；殼的後半貼著地，身體往殼底下伸兩格、從前面露出來；爬的時候動的是貼地的腳的前緣，一伸一縮，觸角不動；縮進殼時殼口蓋上深色的口蓋。動作照蝸牛（爬進場、閒逛、被拍時縮進殼、爬出去）；state 裡的 kind 仍叫 snail，reload 前就在的照樣認得
      - 海螺 6×3（使用者 2026-11-20，v1.3.3 的 7×4 比小隻的 6×4 還大，看了 7×4、6×4、6×3、5×3 的預覽選 6×3）
      - 取代 2026-11-06 的小螢幕（shell）與雷達（monitor），那次因為太難表示而取消
  - id: 28
    spec: 8
    request: ccdrawu doctor 不用打開 ccdrawu，就把側邊欄與狀態列說 config.yaml 有問題的地方修好；側邊欄與狀態列的紅字提示使用者執行它
    tdp: [tdp E1, tdp E3, tdp E3-27, tdp E3-31, tdp E3-37, tdp E3-38, tdp P5, tdp E3-24, tdp E3-32, tdp M5, tdp M5-32, tdp E1-5, tdp E1-7, tdp E3-40]
    remark:
      - 做的事跟打開 ccdrawu 時一樣，只是沒有畫面（tdp E3「沒有畫面時」、E3-31）：搬舊位置的檔、用不了的值先複製成 .bak 再換成預設寫回；要說的寫到 stderr，一件一行，照發生的順序（tdp E3-37）。沒有 App Log 可看，所以每個值也各寫一行，跟 TUI 的 App Log 同一句：key、原本寫的、現在用的
      - config.yaml 或 originals.yaml 讀不了：照 Esc 做，不動檔，stderr 寫路徑與原因，再一句 Open `ccdrawu` to move it aside and start fresh, or set it right by hand.，exit 1（tdp E3-27）；沒有畫面，問不了要不要移到 .bak
      - ccdrawu 不讀的 key 留著，每個一行 Not read，以前讀過的寫 No longer used（tdp E3-38）
      - 沒有要修的：stdout 印 Nothing to set right in <路徑>.，exit 0；搬不動、備份或寫回失敗 exit 1
      - 只管 ccdrawu 自己的檔（設定、原值、搬家），不查外掛裝了沒、版本對不對：使用者要的是紅字的修法（使用者 2026-11-19）；指令是 app 自行決定的（tdp E1）
      - 沒有畫面時照 tdp E1、E3（tdp v1.2.18；tdp #24）：每一件寫 stderr、一行一件、開頭 ccdrawu: 、跟 TUI 同一句話（路徑照 TUI 用 ~ 開頭）；讀不了多一行怎麼辦；exit 1 是沒做完；句子裡的 `ccdrawu` 用反引號（tdp M5；tdp v1.2.18；tdp #25）
  - id: 29
    spec: 11
    request: 在 ccdrawu 的設定選背景 shell 與 monitor 在走道上的樣子，也可以不顯示：shell 有這次試過的每一種（圓頂海螺 6×3、7×4、6×4、5×3，尖塔、號角、長錐海螺，寄居蟹，原本的蝸牛），monitor 是貓頭鷹
    tdp: [tdp P5, tdp panel.12, tdp radio, tdp radio.1, tdp select, tdp E3, tdp popup.1, tdp popup.7, tdp toast.1]
    remark:
      - preferences 頁 Pet 列下面兩列：Shell 十個選項（九種樣子與 none），超過五個用 select（tdp radio.1）；Monitor 兩個選項（owl、none），畫在原地的 radio，跟 Pet 一樣
      - 存在 config.yaml 的 pet.shell、pet.monitor（跟 pet.species 放一起：都是寵物走道上的東西）；值不是選項之一時照 tdp E3 換成預設（sea-snail、owl），跟其他值一樣
      - 側邊欄怎麼畫是外掛的事（tdp P5）：樣子跟著設定一秒內換；選 none 的那一種不畫，寵物不去抓、也不因為牠們不睡；外掛照樣記著牠們（位置、顏色），換回來時在原地出現
      - 每一種樣子照使用者給海螺定的規則：殼的後半貼地、身體伸進殼底下兩格、只有貼地那一列在動、觸角不動、縮進殼時蓋上口蓋；寄居蟹動的是腳；蝸牛照原本的樣子
      - 不會爬、要滾進來的貝殼（扇貝、蛤蜊、側躺的海螺）使用者說不放
