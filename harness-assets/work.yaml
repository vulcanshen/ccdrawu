      蝸牛 6×4 像素（殼、殼上的螺紋、身體），從走道左端或右端外面 9 步（看不到）每秒爬一步進來，停 4～8 秒再爬到走道上別的地方；離場時爬到近的那一端外面才拿掉，走道外一步一欄，只畫在走道裡的那幾欄
      貓頭鷹 5×6 像素，從走道上方每 tick 下降 2 像素，落在隨機位置；飛的時候振翅，每 tick 換一張：翅膀往上舉（9 像素寬）、平伸（7）、往下壓（9）、平伸（使用者 2026-11-19：「貓頭鷹飛起來的時候翅膀打開但是沒有振翅」）；平均約 5 秒眨一次眼（0.4 秒）；離場時振翅，每 tick 往上 2 像素，飛出走道才拿掉
      貓頭鷹停著時每 tick 有 1/50 機率（約 10 秒一次）飛到走道上隨機的別處：每 tick 一步、往上 2 像素到走道頂（8 像素），到了再每 tick 下降 2 像素；落點有紙箱就停在紙箱上，最高到 OWL_TOP（走道 14 像素減貓頭鷹 6 像素，取整層＝8，第二層），第三層停在它前面；腳下的紙箱沒了就降到下面，多了就上去
